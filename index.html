<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melike, benim herşeyim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d');
const cache = document.createElement('canvas');   // kalp ışınları bir kere çizilip burada saklanır
const cg = cache.getContext('2d');
let W, H, S, D = 1, cached = false;

function resize() {
  D = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  c.width = W * D; c.height = H * D;
  g.setTransform(D, 0, 0, D, 0, 0);
  S = Math.min(W, H) / 600;
  cached = false;
}
window.addEventListener('resize', resize);
resize();

const X = x => W / 2 + x * S;
const Y = y => H / 2 - y * S;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = v => Math.max(0, Math.min(1, v));
const ease = v => v * v * (3 - 2 * v);
const N = 170;

const heartPt = u => [
  160 * Math.pow(Math.sin(u), 3),
  13 * (16 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u))
];

// Işınlar (pembe: gül pembesinden eflatuna)
const segs = [];
for (let i = 0; i <= N; i++) {
  const [x, y] = heartPt(i * Math.PI * 2 / N);
  const sp = [];
  for (let a = 0; a < 360; a += 45) {
    const l = rnd(3, 7), r = a * Math.PI / 180;
    sp.push([x + l * Math.cos(r), y + l * Math.sin(r)]);
  }
  segs.push({ x, y, sp, col: `hsl(${335 - i / N * 55}, 72%, 70%)` });
}

function drawSegs(ctx, n) {
  ctx.lineWidth = Math.max(1, S);
  for (let i = 0; i < n && i < segs.length; i++) {
    const s = segs[i];
    ctx.strokeStyle = s.col;
    ctx.beginPath();
    ctx.moveTo(X(0), Y(0));
    ctx.lineTo(X(s.x), Y(s.y));
    for (const q of s.sp) { ctx.moveTo(X(s.x), Y(s.y)); ctx.lineTo(X(q[0]), Y(q[1])); }
    ctx.stroke();
  }
}

function buildCache() {
  cache.width = c.width; cache.height = c.height;
  cg.setTransform(D, 0, 0, D, 0, 0);
  cg.clearRect(0, 0, W, H);
  drawSegs(cg, N + 1);
  cached = true;
}

// Küçük kalp
const SHAPE = [];
for (let a = 0; a <= 360; a += 15) SHAPE.push(heartPt(a * Math.PI / 180).map(v => v / 10));
function kalp(x, y, size, color, alpha = 1) {
  const k = size / 16;
  g.globalAlpha = alpha;
  g.fillStyle = color;
  g.beginPath();
  SHAPE.forEach((p, i) => {
    const px = X(x + p[0] * k), py = Y(y + p[1] * k);
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  });
  g.closePath();
  g.fill();
  g.globalAlpha = 1;
}

// Simli parıltı (4 köşeli yıldız)
function sparkle(x, y, r, rot, color, a) {
  if (a < 0.02) return;
  const R = r * S, q = R * 0.16;
  g.save();
  g.translate(X(x), Y(y));
  g.rotate(rot);
  g.globalAlpha = a;
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(0, -R);
  g.quadraticCurveTo(q, -q, R, 0);
  g.quadraticCurveTo(q, q, 0, R);
  g.quadraticCurveTo(-q, q, -R, 0);
  g.quadraticCurveTo(-q, -q, 0, -R);
  g.fill();
  g.beginPath();
  g.arc(0, 0, R * 0.22, 0, 7);
  g.fill();
  g.restore();
}

const PEMBE = ['#ff69b4', '#ff3c78', '#ff96c8', '#ff5a8c', '#dc3ca0', '#ffbed2'];
const GLITTER = ['#ffffff', '#ffd6ea', '#ffb3d9', '#fff0b8', '#ffe1f0'];

const hearts = Array.from({ length: 18 }, () => ({
  x: rnd(-280, 280), y: rnd(-320, 320), v: rnd(25, 55),
  s: rnd(6, 16), ph: rnd(0, 6.28), c: PEMBE[Math.floor(rnd(0, PEMBE.length))]
}));
const stars = Array.from({ length: 40 }, () => ({ x: rnd(-300, 300), y: rnd(-300, 300), ph: rnd(0, 6.28) }));

// Sabit yerlerde yanıp sönen simler: kalbin içi, çevresi ve yazıların üstü
const glitter = [];
function addGlitter(x, y, big) {
  glitter.push({ x, y, r: big ? rnd(9, 15) : rnd(4, 9), ph: rnd(0, 6.28), sp: rnd(1.5, 3.6),
    rot: rnd(-0.3, 0.3), c: GLITTER[Math.floor(rnd(0, GLITTER.length))] });
}
for (let i = 0; i < 45; i++) {          // kalbin içinde ve kenarında
  const [hx, hy] = heartPt(rnd(0, 6.283));
  const rad = Math.sqrt(Math.random()) * 1.05;
  addGlitter(hx * rad, hy * rad, Math.random() < 0.3);
}
for (let i = 0; i < 18; i++) addGlitter(rnd(-300, 300), rnd(-280, 260), Math.random() < 0.3);
for (let i = 0; i < 10; i++) addGlitter(rnd(-110, 110), rnd(-5, 35), false);   // "Melike" üstü
for (let i = 0; i < 10; i++) addGlitter(rnd(-135, 135), rnd(-60, -35), false); // alt yazı üstü

// Dokununca / fareyle gezinince saçılan simler
const bursts = [];
function spawn(px, py, n) {
  const x = (px - W / 2) / S, y = (H / 2 - py) / S;
  for (let i = 0; i < n && bursts.length < 160; i++) {
    const ang = rnd(0, 6.283), sp = rnd(20, 90);
    bursts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp + 20,
      life: 1, d: rnd(0.8, 1.6), r: rnd(4, 10), rot: rnd(-1, 1),
      c: GLITTER[Math.floor(rnd(0, GLITTER.length))] });
  }
}
c.addEventListener('pointerdown', e => spawn(e.clientX, e.clientY, 14));
c.addEventListener('pointermove', e => { if (Math.random() < 0.5) spawn(e.clientX, e.clientY, 1); });

const DRAW_MS = N * 20;
let t0 = null, last = 0;

function scene(ts, dt) {
  // Arka plan yıldızları
  for (const s of stars) {
    const b = 0.5 + 0.5 * Math.sin(ts * 4.5 + s.ph);
    g.fillStyle = `rgba(255,255,255,${0.25 + 0.75 * b})`;
    g.beginPath();
    g.arc(X(s.x), Y(s.y), (1 + b * 1.5) * S, 0, 7);
    g.fill();
  }

  // Kalp ışınları (hazır çizimden)
  if (!cached) buildCache();
  g.drawImage(cache, 0, 0, W, H);

  // Süzülen kalpler
  for (const h of hearts) {
    h.y += h.v * dt;
    if (h.y > 330) { h.y = -330; h.x = rnd(-280, 280); }
    kalp(h.x + 18 * Math.sin(ts * 1.0 + h.ph), h.y, h.s, h.c, 0.9);
  }

  // Atan kalp
  const nabiz = 1 + 0.22 * Math.pow(Math.max(0, Math.sin(ts * 7.5)), 2);
  kalp(0, -105, 13 * nabiz, '#ff285a');

  // Simler
  g.globalCompositeOperation = 'lighter';
  const giris = ease(clamp(ts / 1.5));
  for (const p of glitter) {
    const a = Math.pow(Math.max(0, Math.sin(ts * p.sp + p.ph)), 5) * giris;
    sparkle(p.x, p.y, p.r * (0.5 + 0.5 * a), p.rot + ts * 0.2, p.c, a);
  }
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.life -= dt / b.d;
    if (b.life <= 0) { bursts.splice(i, 1); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.vy -= 40 * dt;
    sparkle(b.x, b.y, b.r * (0.4 + 0.6 * b.life), b.rot + ts * 2, b.c, b.life);
  }
  g.globalCompositeOperation = 'source-over';

  // Yazılar
  const a1 = ease(clamp(ts / 1.2)), a2 = ease(clamp((ts - 1.2) / 1.2));
  const nefes = 1 - 0.12 * (0.5 - 0.5 * Math.sin(ts * 3.3)) * clamp(ts - 2.4);
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';

  const bob1 = Math.sin(ts * 2.3) * 2 * S;
  g.font = `700 ${58 * S}px 'Dancing Script', 'Brush Script MT', cursive`;
  g.fillStyle = '#000';
  g.fillText('Melike', X(2), Y(-12) + 2 + bob1);
  g.save();
  g.shadowColor = 'rgba(255,105,180,0.9)';
  g.shadowBlur = 14 * S * (0.6 + 0.4 * Math.sin(ts * 3.6));
  g.fillStyle = `rgba(255,150,200,${a1 * nefes})`;
  g.fillText('Melike', X(0), Y(-10) + 2 + bob1);
  g.restore();

  const metin = 'benim herşeyim';
  const bob2 = Math.sin(ts * 2.3 + 1.2) * 2 * S;
  g.font = `700 ${30 * S}px 'Dancing Script', 'Brush Script MT', cursive`;
  const tw = g.measureText(metin).width;
  g.fillStyle = '#000';
  g.fillText(metin, X(2), Y(-57) + 2 + bob2);
  const bandX = X(0) - tw / 2 - tw * 0.2 + ((ts * 100) % (tw * 1.4));
  const gr = g.createLinearGradient(bandX - tw * 0.18, 0, bandX + tw * 0.18, 0);
  gr.addColorStop(0, '#ffc4de');
  gr.addColorStop(0.5, '#ffffff');
  gr.addColorStop(1, '#ffc4de');
  g.save();
  g.globalAlpha = a2;
  g.shadowColor = 'rgba(255,105,180,0.8)';
  g.shadowBlur = 10 * S * (0.6 + 0.4 * Math.sin(ts * 3.6 + 1));
  g.fillStyle = gr;
  g.fillText(metin, X(0), Y(-55) + 2 + bob2);
  g.restore();
}

function frame(now) {
  if (t0 === null) { t0 = now; last = now; }
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const el = now - t0;
  g.clearRect(0, 0, W, H);
  if (el < DRAW_MS) drawSegs(g, Math.floor(el / 20) + 1);
  else scene((el - DRAW_MS) / 1000, dt);
  requestAnimationFrame(frame);
}
try { document.fonts.load("700 40px 'Dancing Script'", 'Melike benim herşeyim'); } catch (e) {}
requestAnimationFrame(frame);
</script>
</body>
</html>
