<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melike, benim her şeyim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d');
let W, H, S;
function resize() {
  const d = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  c.width = W * d; c.height = H * d;
  g.setTransform(d, 0, 0, d, 0, 0);
  S = Math.min(W, H) / 600;
}
window.addEventListener('resize', resize);
resize();

const X = x => W / 2 + x * S;
const Y = y => H / 2 - y * S;
const rnd = (a, b) => a + Math.random() * (b - a);
const N = 170;

// Kalp noktaları
const heartPt = u => [
  160 * Math.pow(Math.sin(u), 3),
  13 * (16 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u))
];

// Işınlar ve kıvılcımlar
const segs = [];
for (let i = 0; i <= N; i++) {
  const [x, y] = heartPt(i * Math.PI * 2 / N);
  const sp = [];
  for (let a = 0; a < 360; a += 45) {
    const l = rnd(3, 7), r = a * Math.PI / 180;
    sp.push([x + l * Math.cos(r), y + l * Math.sin(r)]);
  }
  segs.push({ x, y, sp, col: `hsl(${i / N * 144}, 100%, 62%)` });
}

function drawSegs(n) {
  g.lineWidth = Math.max(1, S);
  for (let i = 0; i < n && i < segs.length; i++) {
    const s = segs[i];
    g.strokeStyle = s.col;
    g.beginPath();
    g.moveTo(X(0), Y(0));
    g.lineTo(X(s.x), Y(s.y));
    for (const q of s.sp) { g.moveTo(X(s.x), Y(s.y)); g.lineTo(X(q[0]), Y(q[1])); }
    g.stroke();
  }
}

// Küçük kalp şekli
const SHAPE = [];
for (let a = 0; a <= 360; a += 15) SHAPE.push(heartPt(a * Math.PI / 180).map(v => v / 10));
function kalp(x, y, size, color, alpha = 1) {
  const k = size / 16 * 10 / 10;
  g.globalAlpha = alpha;
  g.fillStyle = color;
  g.beginPath();
  SHAPE.forEach((p, i) => {
    const px = X(x + p[0] * k), py = Y(y + p[1] * k);
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  });
  g.closePath();
  g.fill();
  g.globalAlpha = 1;
}

const PEMBE = ['#ff69b4', '#ff3c78', '#ff96c8', '#ff5a5a', '#dc3ca0', '#ffbed2'];
const hearts = Array.from({ length: 18 }, () => ({
  x: rnd(-280, 280), y: rnd(-320, 320), v: rnd(0.6, 1.8),
  s: rnd(6, 16), ph: rnd(0, 6.28), c: PEMBE[Math.floor(rnd(0, PEMBE.length))]
}));
const stars = Array.from({ length: 40 }, () => ({ x: rnd(-300, 300), y: rnd(-300, 300), ph: rnd(0, 6.28) }));

const clamp = v => Math.max(0, Math.min(1, v));
const DRAW_MS = N * 20;
let start = null, lastK = -1;

function frame(now) {
  if (start === null) start = now;
  const el = now - start;
  g.clearRect(0, 0, W, H);

  if (el < DRAW_MS) {
    drawSegs(Math.floor(el / 20) + 1);
    requestAnimationFrame(frame);
    return;
  }

  const k = (el - DRAW_MS) / 30; // eski turtle kare sayısı
  const dk = lastK < 0 ? 1 : Math.max(0.2, k - lastK);
  lastK = k;

  // Yıldızlar
  for (const s of stars) {
    const b = 0.5 + 0.5 * Math.sin(k * 0.15 + s.ph);
    g.fillStyle = `rgba(255,255,255,${0.25 + 0.75 * b})`;
    g.beginPath();
    g.arc(X(s.x), Y(s.y), (1 + b * 1.5) * S, 0, 7);
    g.fill();
  }

  drawSegs(N + 1);

  // Süzülen kalpler
  for (const h of hearts) {
    h.y += h.v * dk;
    if (h.y > 330) { h.y = -330; h.x = rnd(-280, 280); }
    kalp(h.x + 18 * Math.sin(k * 0.03 + h.ph), h.y, h.s, h.c, 0.9);
  }

  // Atan kalp
  const nabiz = 1 + 0.36 * Math.pow(Math.max(0, Math.sin(k * 0.25)), 2);
  kalp(0, -105, 13 * nabiz, '#ff285a');

  // Yazılar
  const a1 = clamp(k / 40), a2 = clamp((k - 40) / 40);
  const nefes = k > 80 ? 0.85 + 0.15 * Math.sin(k * 0.1) : 1;
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';

  g.font = `700 ${58 * S}px 'Dancing Script', 'Brush Script MT', cursive`;
  g.fillStyle = '#000';
  g.fillText('Melike', X(2), Y(-12) + 2);
  g.fillStyle = `rgba(255,150,200,${a1 * nefes})`;
  g.fillText('Melike', X(0), Y(-10) + 2);

  g.font = `700 ${30 * S}px 'Dancing Script', 'Brush Script MT', cursive`;
  g.fillStyle = '#000';
  g.fillText('benim her şeyim', X(2), Y(-57) + 2);
  g.fillStyle = `rgba(255,235,245,${a2})`;
  g.fillText('benim her şeyim', X(0), Y(-55) + 2);

  requestAnimationFrame(frame);
}
try { document.fonts.load("700 40px 'Dancing Script'", 'Melike benim her şeyim'); } catch (e) {}
requestAnimationFrame(frame);
</script>
</body>
</html>
